spring:
  jackson:
    generator:
      write-bigdecimal-as-plain: true
  application:
    name: zimran-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zimran_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

application:
  default-locale: en

