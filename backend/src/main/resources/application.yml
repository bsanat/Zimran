  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  web:
    max-request-body-bytes: 10240
    rate-limit:
      enabled: true
      requests-per-minute: ${PLAN_RATE_LIMIT_PER_MINUTE:30}
      paths:
        - /api/plan
  events-source:
    # File path or http(s) URL of the JSON event feed. Blank = the catalog answers 503.
    # Default: backend/data/events.json, relative to the directory the app is started from (backend/).
    location: ${EVENTS_JSON_SOURCE:data/events.json}
    refresh-interval: ${EVENTS_JSON_REFRESH:1m}
    connect-timeout: 3s
    read-timeout: 10s
    max-bytes: 52428800
    # Interest -> source category names (ignoring case). A source category equal to an interest id
    # (music, sports, ...) needs no entry. Provisional names: revise them against the real feed's categories.
    # Events whose categories map to no interest are skipped (nothing is guessed).
    category-mapping:
      music: [concert, concerts, live music, music festival]
      sports: [sport, sports event, game]
      food: ["food & drink", food and drink, "food & drinks", culinary, dining, tasting]
      art: [arts, "arts & culture", "art & culture", exhibition, museum, gallery, fine art]
      theater: [theatre, broadway, musical, opera, dance, performing arts]
      outdoors: [outdoor, outdoor activities, park, parks]
      nightlife: [club, clubs, party, parties, dj]
      technology: [tech, "science & technology", science and technology]
      comedy: [stand-up, standup, stand up comedy, improv]
      gaming: [games, esports, video games, board games]
      family: [kids, "kids & family", "family & kids", children]
      books: [book, literature, reading, author talk, poetry]
      ai: [artificial intelligence, machine learning]
      running: [run, marathon, half marathon, 5k, 10k]
      climate: [environment, sustainability, climate change]
      fitness: [workout, exercise, training]
      wellness: [yoga, meditation, "health & wellness", mindfulness]
      crypto: [blockchain, web3, cryptocurrency]
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    connect-timeout: 3s
    # The whole AI call is capped by total-timeout so POST /api/plan answers within 25 s
    # (the frontend aborts at 30 s); the rule-based ranking answers after it.
    read-timeout: 15s
    total-timeout: 18s
    max-output-tokens: 2000
    max-requests-per-minute: ${OPENAI_MAX_REQUESTS_PER_MINUTE:30}
  guest:
    # HMAC-SHA256 key for X-Guest-Token, at least 32 bytes. Blank = random per process (dev only).
    token-secret: ${GUEST_TOKEN_SECRET:}
    token-ttl: ${GUEST_TOKEN_TTL:7d}
    last-seen-update-interval: 5m
  subscription:
    plan:
      price-cents: 999
      currency: USD
      interval: month
      # Labels: messages subscription_feature_<id>
      features: [assistant, pair, alerts, buddy]
    # Product hypotheses. window: aligned to the epoch; no window = once ever (a trial).
    quotas:
      assistant:
        free: { limit: 1, window: 7d }
        premium: { limit: 30, window: 1d }
      pair:
        free: { limit: 1 }
        premium: { limit: 20, window: 1d }
  demo:
    # Also seeds fictional NYC sample events (provider "demo", isDemo = true) at startup.
    enabled: ${DEMO_ENABLED:false}
  ingestion:
    # Scheduled ingestion of every supported city into the events table (Spring cron, 6 fields).
    enabled: ${EVENT_INGESTION_ENABLED:true}
    cron: ${EVENT_INGESTION_CRON:0 */15 * * * *}
    # A city with no provider events in the catalog is fetched live at most this often.
    live-fetch-cooldown: 1m
  rate-limit:
    enabled: true
    max-tracked-keys: 50000
    # Token bucket per action and caller (scope, or client address before a guest exists):
    # capacity = burst, refilled continuously over refill-period.
    actions:
      guest-session: { capacity: 10, refill-period: 1m }
      ai-parse: { capacity: 10, refill-period: 1m }
      ai-recommend: { capacity: 10, refill-period: 1m }
      pair-create: { capacity: 5, refill-period: 1m }
      buddy-post: { capacity: 5, refill-period: 1h }
      buddy-request: { capacity: 20, refill-period: 1h }
      alerts-check: { capacity: 6, refill-period: 1m }
  ai:
    # AI assistant (POST /api/ai/recommend): events sent to the model per recommendation.
    max-candidates: 20
  pair:
    # How long a Pair invite stays open before the session EXPIRES.
    invite-ttl: ${PAIR_INVITE_TTL:48h}
    min-suggestions: 3
    max-suggestions: 5
  planner:
    max-candidates: 30
    max-recommendations: 5
    max-range-days: 7

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
