spring:
  jackson:
    generator:
      write-bigdecimal-as-plain: true
  application:
    name: zimran-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zimran_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

application:
  default-locale: en

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ticketmaster:
    base-url: ${TICKETMASTER_BASE_URL:https://app.ticketmaster.com/discovery/v2}
    api-key: ${TICKETMASTER_API_KEY:}
    connect-timeout: 3s
    read-timeout: 10s
    page-size: 100
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    connect-timeout: 3s
    read-timeout: 30s
    max-output-tokens: 2000
  planner:
    max-candidates: 30
    max-recommendations: 5
    max-range-days: 7

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
